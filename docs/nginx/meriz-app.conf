# L'application Meriz, en version web. Une SPA : toute route inconnue rend
# index.html, sinon les liens de confirmation d'email et de mot de passe
# tomberaient en 404.

server {
    listen 80;
    listen [::]:80;
    server_name app.meriz.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://app.meriz.fr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.meriz.fr;

    root /var/www/meriz-app;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/app.meriz.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.meriz.fr/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Les fichiers portent une empreinte dans leur nom : leur contenu ne
    # change jamais, on peut donc les garder longtemps.
    #
    # add_header ne s'herite pas : un emplacement qui en pose un seul perd
    # tous ceux du serveur. Les entetes sont donc repetes ici et plus bas.
    # Un seul Cache-Control, et pas « expires » en plus : la directive
    # expires pose son propre max-age, et les deux sortaient en double.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # La coquille, elle, ne se garde pas : sinon un visiteur conserverait
    # l'ancienne application, et ses anciens appels, apres un deploiement.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Rien de cache n'est servi, sauf /.well-known : security.txt et les
    # fichiers de ce genre ont leur place, le reste non.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
