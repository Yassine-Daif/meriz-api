# Le site vitrine, du HTML statique. meriz.fr est l'adresse canonique,
# celle du sitemap ; www renvoie vers elle.

server {
    listen 80;
    listen [::]:80;
    server_name meriz.fr www.meriz.fr;

    # Le defi de Let's Encrypt, pour les renouvellements. Le prefixe ^~
    # coupe court aux emplacements par expression reguliere, et la
    # redirection est dans un emplacement plutot qu'au niveau du serveur :
    # un « return » de serveur s'execute avant la recherche d'emplacement,
    # et emporterait le defi avec lui.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://meriz.fr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.meriz.fr;

    ssl_certificate /etc/letsencrypt/live/meriz.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meriz.fr/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;

    return 301 https://meriz.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meriz.fr;

    root /var/www/meriz-site;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/meriz.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meriz.fr/privkey.pem;

    # Six mois, sans includeSubDomains ni preload : reversible.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Rien de cache n'est servi, sauf /.well-known : security.txt et les
    # fichiers de ce genre ont leur place, le reste non.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
