# Meriz API. Du JSON, plus la zone d'administration sur /admin, plus le
# websocket du direct relaye vers Reverb.

server {
    listen 80;
    listen [::]:80;
    server_name api.meriz.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://api.meriz.fr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.meriz.fr;

    root /var/www/meriz-api/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/api.meriz.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.meriz.fr/privkey.pem;

    # Les autres entetes de securite viennent du middleware SecurityHeaders,
    # qui les pose sur toute reponse de l'API, erreurs comprises. Le HSTS
    # est une affaire de transport, pas d'application : il est ici.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Juste au-dessus de post_max_size (20 Mo), lui-meme au-dessus de
    # upload_max_filesize (16 Mo), qui couvre LESSONS_MAX_AUDIO_KB. Un envoi
    # trop gros est ainsi refuse par PHP, avec un message JSON, plutot que
    # tranche par nginx.
    client_max_body_size 24m;

    # Au-dela, nginx tranche avant PHP, et sa page de refus est en HTML.
    # L'API ne parle que JSON : on rend ici le meme message que
    # ApiErrorMessages::PAYLOAD_TOO_LARGE, pour que le client n'ait jamais
    # a deviner la forme d'une reponse.
    error_page 413 = @trop_volumineux;

    location @trop_volumineux {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=15552000" always;
        return 413 '{"message":"Requête trop volumineuse."}';
    }

    # Reverb, avant le reste. Deux chemins, aucun decoratif : /app/{cle} est
    # le websocket que le client ouvre, /apps/{id}/events l'API par laquelle
    # le serveur publie ses evenements, sur son propre domaine public.
    location ~ ^/(app|apps)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Montee en websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une observation en direct reste ouverte longtemps.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    # Rien de cache n'est servi, sauf /.well-known : security.txt et les
    # fichiers de ce genre ont leur place, le reste non.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
